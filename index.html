<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幸运抽奖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#1a1a2e,#16213e 40%,#0f3460);min-height:100vh;color:#fff}
.c{max-width:460px;margin:0 auto;padding:20px;min-height:100vh}
.hd{text-align:center;padding:30px 0 20px}
.hd .ic{font-size:64px;animation:fl 2s ease-in-out infinite}
.hd h1{font-size:28px;margin:10px 0 4px;background:linear-gradient(135deg,#f5af19,#f12711);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd .sn{font-size:14px;color:#aaa}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ca{background:rgba(255,255,255,.06);border-radius:20px;padding:24px 20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.08)}
.ca h3{font-size:17px;margin-bottom:14px;text-align:center}
.ca h4{font-size:15px;margin-bottom:10px;color:#f5af19}
.bt{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:18px;font-weight:bold;cursor:pointer;text-align:center;transition:all .2s;margin-bottom:10px}
.bt:active{transform:scale(.97)}
.bt-g{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff;box-shadow:0 4px 15px rgba(245,175,25,.3)}
.bt-o{background:transparent;border:2px solid rgba(255,255,255,.25);color:#fff}
.ip{width:100%;padding:14px 16px;border:2px solid rgba(255,255,255,.2);border-radius:14px;font-size:17px;background:rgba(255,255,255,.08);color:#fff;outline:none;margin-bottom:12px;text-align:center}
.ip:focus{border-color:#f5af19}.ip::placeholder{color:rgba(255,255,255,.35)}
.la{text-align:center;padding:10px 0}
.la .pi{font-size:80px}.la .pi.spn{animation:spn .08s linear infinite}
@keyframes spn{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.la .pr{font-size:26px;font-weight:bold;margin-top:12px;background:linear-gradient(135deg,#f5af19,#f12711);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0;transform:scale(.5);transition:all .4s cubic-bezier(.175,.885,.32,1.275)}
.la .pr.s{opacity:1;transform:scale(1)}
.la .ht{color:rgba(255,255,255,.5);font-size:14px;margin-top:8px}
.rs{text-align:center;padding:10px 0}.rs .re{font-size:70px;animation:bi .6s}
.rs .rt{font-size:24px;font-weight:bold;margin:10px 0}
.rs .rp{font-size:22px;color:#f5af19;font-weight:bold}
.rs .rb{color:rgba(255,255,255,.5);font-size:13px;margin-top:6px}
@keyframes bi{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.pw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.pw:last-child{border-bottom:none}.pw .pn{flex:1}.pw .pi2{color:rgba(255,255,255,.5);font-size:12px;text-align:right}
.tg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(245,175,25,.15);color:#f5af19}
.to{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;background:rgba(0,0,0,.85);color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;animation:fi 2s forwards;pointer-events:none;display:none}
@keyframes fi{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.er{text-align:center;padding:60px 20px}.er .ic{font-size:70px;margin-bottom:16px}.er h2{font-size:20px;margin-bottom:8px}.er p{color:#aaa;font-size:14px}
.cc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:150;overflow:hidden}
.cf{position:absolute;width:10px;height:10px;animation:cf 3s forwards}
@keyframes cf{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:360px){.c{padding:15px}.hd{padding:20px 0 15px}.hd .ic{font-size:50px}.hd h1{font-size:24px}}
</style>
</head>
<body>
<div class="c">
<div id="se" class="er" style="display:none"><div class="ic">🎰</div><h2 id="set">暂无抽奖活动</h2><p id="sem">请联系管理员获取链接</p></div>

<div id="si" style="display:none">
<div class="hd"><div class="ic">🎪</div><h1>幸运抽奖</h1><div class="sn" id="hsn"></div></div>
<div class="ca" style="text-align:center">
<div style="font-size:50px;margin-bottom:8px">🎁</div><h3>输入姓名，试试手气！</h3>
<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:16px">每人每轮仅限抽一次</p>
<input class="ip" id="pn" placeholder="请输入你的姓名" maxlength="30">
<button class="bt bt-g" onclick="draw()">🎲 开始抽奖</button>
</div>
<div class="ca" id="ppc"><h4>🎁 奖项一览</h4><div id="pp"></div></div>
</div>

<div id="sd" style="display:none">
<div class="hd"><div class="ic">🎰</div><h1>抽奖中...</h1></div>
<div class="ca la"><div class="pi spn" id="si2">🎁</div><div class="ht" id="dh">正在为你抽取奖品…</div><div class="pr" id="drn"></div></div>
</div>

<div id="sr" style="display:none">
<div class="hd"><div class="ic">🎊</div><h1>抽奖结果</h1></div>
<div class="ca rs"><div class="re" id="re"></div><div class="rt" id="rt"></div><div class="rp" id="rp"></div><div class="rb" id="rb"></div></div>
<button class="bt bt-o" onclick="rst()">🔄 返回首页</button>
</div>
</div>
<div class="cc" id="cc"></div>
<div class="to" id="to"></div>

<script>
// ==== GitHub API ====
const REPO='Nick-701/lottery-draw';
const TOKEN='GITHUB_TOKEN_HERE'; // 替换为你的 token
const API='https://api.github.com/repos/'+REPO+'/contents/data.json';

function toast(m){const t=document.getElementById('to');t.textContent=m;t.style.display='block';t.style.animation='none';t.offsetHeight;t.style.animation='fi 2s forwards';setTimeout(()=>t.style.display='none',2000);}
function ss(s){['se','si','sd','sr'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(s).style.display='block';}
function cnf(){const c=document.getElementById('cc'),cl=['#f5af19','#f12711','#ff6b6b','#ffd93d','#6bcb77','#4d96ff'];for(let i=0;i<50;i++){const e=document.createElement('div');e.className='cf';e.style.left=Math.random()*100+'%';e.style.top=-(Math.random()*20)+'px';e.style.width=(6+Math.random()*10)+'px';e.style.height=(6+Math.random()*10)+'px';e.style.background=cl[Math.floor(Math.random()*cl.length)];e.style.borderRadius=Math.random()>.5?'50%':'2px';e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*1+'s';c.appendChild(e);}setTimeout(()=>c.innerHTML='',4000);}

async function ghRead(){
  const r=await fetch(API,{headers:{Authorization:'token '+TOKEN}});
  if(!r.ok)throw new Error('加载失败');
  const j=await r.json();
  const d=JSON.parse(atob(j.content));
  d._sha=j.sha;
  return d;
}

async function ghWrite(d){
  const sha=d._sha;delete d._sha;
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2))));
  const r=await fetch(API,{method:'PUT',headers:{Authorization:'token '+TOKEN},body:JSON.stringify({message:'抽奖',content,sha})});
  if(!r.ok)throw new Error('保存失败');
  const j=await r.json();d._sha=j.content.sha;return d;
}

// ==== 抽奖逻辑 ====
const CODE=new URLSearchParams(location.search).get('code');
let session=null,data=null;

async function init(){
  if(!CODE){document.getElementById('set').textContent='链接无效';document.getElementById('sem').textContent='请通过管理员分享的链接打开';ss('se');return;}
  try{
    data=await ghRead();
    const pub=data.published[CODE];
    if(!pub)throw new Error('链接无效或已过期');
    session=data.sessions.find(s=>s.id===pub.sessionId);
    if(!session)throw new Error('轮次不存在');
    document.getElementById('hsn').textContent=session.name;
    rpp();ss('si');
  }catch(e){document.getElementById('set').textContent='加载失败';document.getElementById('sem').textContent=e.message;ss('se');}
}

function rpp(){
  const pz=session.prizes||[],c=document.getElementById('pp');
  if(!pz.length){c.innerHTML='<p style="color:rgba(255,255,255,.4);text-align:center;font-size:13px">暂无奖项</p>';document.getElementById('ppc').style.display='none';return;}
  document.getElementById('ppc').style.display='block';
  const tw=pz.reduce((s,p)=>s+p.weight,0);
  c.innerHTML=pz.map(p=>`<div class="pw"><span class="pn">${p.name} ${p.remaining<=0?'<span class="tg" style="background:rgba(255,255,255,.1);color:#aaa">已抽完</span>':''}</span><span class="pi2">${tw>0?(p.weight/tw*100).toFixed(1):0}% | 剩${p.remaining}/${p.quantity}</span></div>`).join('');
}

async function draw(){
  const n=document.getElementById('pn').value.trim();if(!n){toast('请输入姓名');return;}
  // 重新加载最新数据
  try{data=await ghRead();session=data.sessions.find(s=>s.id===session.id);if(!session)throw new Error();}
  catch(e){toast('数据加载失败，请重试');return;}

  const pt=session.participants.find(p=>p.name===n);
  if(!pt){toast('姓名不在参与者名单中');return;}
  if(pt.drawn){const r=session.records.find(x=>x.name===n);r?showR(n,r.prize,true):toast('已参与过');return;}

  const av=session.prizes.filter(p=>p.remaining>0);
  if(!av.length){toast('奖品已抽完');return;}

  ss('sd');document.getElementById('si2').className='pi spn';document.getElementById('si2').textContent='🎰';document.getElementById('dh').style.display='block';document.getElementById('dh').textContent='正在为你抽取奖品…';document.getElementById('drn').className='pr';document.getElementById('drn').textContent='';

  const tw=av.reduce((s,p)=>s+p.weight,0);let rnd=Math.random()*tw,sl=av[0];
  for(const p of av){rnd-=p.weight;if(rnd<=0){sl=p;break;}}

  // 更新数据并保存
  sl.remaining--;pt.drawn=true;session.records.push({name:n,prize:sl.name,time:new Date().toLocaleString('zh-CN')});
  try{data=await ghWrite(data);}catch(e){toast('保存失败，请重试');rst();return;}

  setTimeout(()=>{
    document.getElementById('si2').className='pi';document.getElementById('si2').textContent='🎁';document.getElementById('dh').style.display='none';document.getElementById('drn').textContent=sl.name;document.getElementById('drn').className='pr s';
    setTimeout(()=>showR(n,sl.name,false),1500);
  },3000);
}

function showR(n,pr,ad){
  const it=pr.includes('谢谢');document.getElementById('re').textContent=ad?'👋':it?'😊':'🎉';document.getElementById('rt').textContent=ad?'已参与过':it?'别灰心！':'恭喜你！';document.getElementById('rp').textContent=ad?`上次：${pr}`:it?'下次好运~':pr;document.getElementById('rb').textContent=n;ss('sr');if(!ad&&!it)cnf();
}
function rst(){rpp();ss('si');document.getElementById('pn').value='';}
document.getElementById('pn').addEventListener('keydown',e=>{if(e.key==='Enter')draw();});
init();
</script>
</body>
</html>
